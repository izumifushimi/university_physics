/* 启动自检：若页面未能渲染，直接把原因显示出来，而不是留一片空白 */
window.addEventListener('load', function () {
  setTimeout(function () {
    var view = document.getElementById('view');
    if (view && view.querySelector('.page, .noscript')) return;
    var missing = [];
    ['katex', 'PHYS', 'PHYS.Store', 'PHYS.views', 'PHYS.App', 'PHYS.content'].forEach(function (k) {
      var v = k.split('.').reduce(function (o, key) { return o && o[key]; }, window);
      if (!v) missing.push(k);
    });
    var box = document.createElement('div');
    box.className = 'noscript';
    box.innerHTML = '<h1>页面没有正常加载</h1>' +
      '<p>原因：' + (missing.length ? '以下脚本未能执行 —— <code>' + missing.join('</code>, <code>') + '</code>' : '脚本已执行，但页面内容为空') + '</p>' +
      '<p style="font-size:.9rem;color:#6a736c">常见原因：<br>' +
      '1. 只复制了 index.html，没有连同 <code>assets/</code>、<code>content/</code>、<code>vendor/</code> 三个文件夹一起复制。<br>' +
      '2. 文件是从压缩包或网盘直接打开的，路径中没有完整的文件夹结构。<br>' +
      '建议在站点根目录运行 <code>python3 -m http.server 8000</code> 后访问 http://localhost:8000 。</p>';
    view.appendChild(box);
  }, 1200);
});
</script>
